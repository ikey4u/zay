[package]
name = "singbox"
version = "0.1.0"
edition = "2024"
description = "Native Rust migration of sing-box, designed as an embeddable library"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "singbox"
path = "src/lib.rs"

[features]
default = ["full"]
# The default engine keeps the existing complete API and protocol registry.
# Embedders can disable defaults and select socks for standalone forwarding.
socks = ["dep:socket2"]
full = [
    "socks",
    "tokio/fs", "tokio/process", "tokio/signal",
    "tokio-util/compat", "tokio-util/io",
    "dep:aes",
    "dep:aes-gcm",
    "dep:am-lzo1x",
    "dep:argon2",
    "dep:aria",
    "dep:arti-client",
    "dep:async-compression",
    "dep:async-trait",
    "dep:aws-lc-rs",
    "dep:base64",
    "dep:blake2",
    "dep:blake3",
    "dep:blowfish",
    "dep:boringtun",
    "dep:bytes",
    "dep:camellia",
    "dep:capnp",
    "dep:capnp-futures",
    "dep:capnp-rpc",
    "dep:capnpc",
    "dep:capnpc-embedded",
    "dep:cast5",
    "dep:cbc",
    "dep:cbc01",
    "dep:cc",
    "dep:ccm",
    "dep:cfb-mode",
    "dep:cfb08",
    "dep:chacha20poly1305",
    "dep:cookie_store",
    "dep:crab_nat",
    "dep:crc32fast",
    "dep:crypto_box",
    "dep:ctr",
    "dep:data-encoding",
    "dep:des",
    "dep:dtls",
    "dep:ed25519-dalek",
    "dep:flate2",
    "dep:fslock",
    "dep:futures",
    "dep:futures-util",
    "dep:getrandom",
    "dep:h3",
    "dep:h3-quinn",
    "dep:hashlink",
    "dep:hex",
    "dep:hickory-proto",
    "dep:hickory-resolver",
    "dep:hkdf",
    "dep:hmac",
    "dep:hmac13",
    "dep:http",
    "dep:http-body-util",
    "dep:httparse",
    "dep:hyper",
    "dep:hyper-util",
    "dep:igd-next",
    "dep:instant-acme",
    "dep:ipnet",
    "dep:jsonschema",
    "dep:kisaseed",
    "dep:libc",
    "dep:lz4_flex",
    "dep:md-5",
    "dep:minicbor",
    "dep:n0-watcher",
    "dep:netdev",
    "dep:netlink-bindings",
    "dep:netlink-socket2",
    "dep:netwatch",
    "dep:network-interface",
    "dep:nfq",
    "dep:nix",
    "dep:ofb",
    "dep:ofb06",
    "dep:openssl",
    "dep:p256",
    "dep:parking_lot",
    "dep:pem",
    "dep:percent-encoding",
    "dep:portable-pty",
    "dep:prost",
    "dep:protoc-bin-vendored",
    "dep:quick-xml",
    "dep:quinn",
    "dep:quinn-proto",
    "dep:rand",
    "dep:rcgen",
    "dep:regex",
    "dep:reqwest",
    "dep:resolv-conf",
    "dep:ripemd",
    "dep:rtnetlink",
    "dep:rusqlite",
    "dep:russh",
    "dep:rustls",
    "dep:rustls-acme",
    "dep:rustls-native-certs",
    "dep:rustls-pemfile",
    "dep:schannel",
    "dep:scraper",
    "dep:serde",
    "dep:serde_json",
    "dep:sha1",
    "dep:sha1_11",
    "dep:sha2",
    "dep:sha3",
    "dep:shadowsocks",
    "dep:sm4",
    "dep:smoltcp",
    "dep:smux",
    "dep:snow",
    "dep:socket2",
    "dep:sysinfo",
    "dep:system-configuration",
    "dep:tempfile",
    "dep:thiserror",
    "dep:time",
    "dep:tokio-openssl",
    "dep:tokio-rustls",
    "dep:tokio-stream",
    "dep:tokio-tungstenite",
    "dep:tonic",
    "dep:tonic-health",
    "dep:tonic-prost",
    "dep:tonic-prost-build",
    "dep:tonic-reflection",
    "dep:tor-rtcompat",
    "dep:tracing",
    "dep:tun",
    "dep:url",
    "dep:uuid",
    "dep:webpki-roots",
    "dep:webrtc-util",
    "dep:windivert",
    "dep:windows-sys",
    "dep:x25519-dalek",
    "dep:x509-parser",
    "dep:yamux",
    "dep:zbus",
    "dep:zeroize",
    "dep:zip",
    "dep:zstd",
