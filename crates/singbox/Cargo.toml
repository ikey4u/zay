[dependencies]
base64 = { version = "0.22", optional = true }
capnp = { version = "0.27.2", optional = true }
capnp-futures = { version = "0.27.0", optional = true }
capnp-rpc = { version = "0.27.0", optional = true }
boringtun = { package = "boringtun-easytier", version = "0.6.1", optional = true }
blake3 = { version = "1", optional = true }
blake2 = { version = "0.10", optional = true }
aes = { version = "0.9", optional = true }
aes-gcm = { version = "0.11.1", optional = true }
am-lzo1x = { version = "0.2.0", optional = true }
aria = { version = "0.2.0", optional = true }
argon2 = { version = "0.5.3", optional = true }
arti-client = { version = "0.42.0", default-features = false, features = ["compression", "onion-service-client", "rustls", "tokio"], optional = true }
async-trait = { version = "0.1", optional = true }
async-compression = { version = "0.4.44", features = ["gzip", "tokio"], optional = true }
aws-lc-rs = { version = "1.18", default-features = false, optional = true }
bytes = { version = "1", optional = true }
blowfish = { version = "0.10.0", optional = true }
camellia = { version = "0.2.1", optional = true }
cast5 = { version = "0.12.0", optional = true }
cbc = { version = "0.2.1", features = ["alloc"], optional = true }
cbc01 = { package = "cbc", version = "0.1.2", features = ["alloc"], optional = true }
ccm = { version = "0.6.1", optional = true }
cfb-mode = { version = "0.9.1", optional = true }
cfb08 = { package = "cfb-mode", version = "0.8.2", optional = true }
crab_nat = { version = "0.8.1", optional = true }
chacha20poly1305 = { version = "0.11.0", optional = true }
getrandom = { version = "0.3", optional = true }
crc32fast = { version = "1", optional = true }
ctr = { version = "0.10.1", optional = true }
cookie_store = { version = "0.22.1", optional = true }
crypto_box = { version = "0.9.1", features = ["salsa20"], optional = true }
data-encoding = { version = "2", optional = true }
des = { version = "0.9.0", optional = true }
dtls = { version = "0.17.2", features = ["pem"], optional = true }
ed25519-dalek = { version = "2.2.0", optional = true }
futures-util = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
flate2 = { version = "1", features = ["zlib-rs"], optional = true }
fslock = { version = "0.2.1", optional = true }
hex = { version = "0.4", optional = true }
hickory-proto = { version = "0.26.1", features = ["mdns"], optional = true }
hickory-resolver = { version = "0.26.1", optional = true }
resolv-conf = { version = "0.7.6", optional = true }
hkdf = { version = "0.13", optional = true }
hmac = { version = "0.12", optional = true }
hmac13 = { package = "hmac", version = "0.13", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
hashlink = { version = "0.11.1", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1.5", features = ["channel"], optional = true }
httparse = { version = "1", optional = true }
hyper = { version = "1.11.1", features = ["client", "server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "time", "x509-parser"], optional = true }
ipnet = { version = "2", features = ["serde"], optional = true }
kisaseed = { version = "0.1.3", optional = true }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"], optional = true }
igd-next = { version = "0.17.1", features = ["aio_tokio"], optional = true }
jsonschema = { version = "0.52.1", default-features = false, optional = true }
md-5 = { version = "0.11", optional = true }
minicbor = { version = "2.3.0", features = ["std"], optional = true }
network-interface = { version = "2", optional = true }
netdev = { version = "0.46.2", default-features = false, features = ["gateway"], optional = true }
netwatch = { version = "0.19.3", optional = true }
n0-watcher = { version = "1.0.0", optional = true }
ofb = { version = "0.7.1", optional = true }
ofb06 = { package = "ofb", version = "0.6.1", optional = true }
parking_lot = { version = "0.12", optional = true }
p256 = { version = "0.14.0-rc.7", optional = true }
pem = { version = "3.0.6", optional = true }
percent-encoding = { version = "2", optional = true }
portable-pty = { version = "0.9", optional = true }
prost = { version = "0.14.4", optional = true }
quinn = { version = "0.11.9", features = ["ring"], optional = true }
quinn-proto = { version = "0.11.14", optional = true }
quick-xml = { version = "0.41.0", optional = true }
rand = { version = "0.8", optional = true }
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "aws_lc_rs"], optional = true }
regex = { version = "1", optional = true }
ripemd = { version = "0.2.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["brotli", "prefer-post-quantum", "ring", "std", "zlib"], optional = true }
rustls-acme = { version = "0.15.4", default-features = false, features = ["aws-lc-rs", "tokio", "webpki-roots"], optional = true }
rustls-native-certs = { version = "0.8.4", optional = true }
rustls-pemfile = { version = "2", optional = true }
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
russh = { version = "0.60", optional = true }
scraper = { version = "0.18.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["preserve_order"], optional = true }
sha2 = { version = "0.11", optional = true }
sha3 = { version = "0.11", optional = true }
sha1 = { version = "0.10", optional = true }
sha1_11 = { package = "sha1", version = "0.11", optional = true }
shadowsocks = { path = "vendor/shadowsocks", version = "1.25.0", default-features = false, features = ["aead-cipher-extra", "aead-cipher-2022", "security-replay-attack-detect"], optional = true }
smux = { version = "0.2.0", optional = true }
sm4 = { version = "0.6.0", optional = true }
smoltcp = { git = "https://github.com/smoltcp-rs/smoltcp.git", rev = "0a926767a68bc88d5512afefa7529c5ecdade4ea", default-features = false, features = ["std", "medium-ip", "socket-tcp", "socket-udp", "socket-icmp", "proto-ipv4", "proto-ipv6", "async", "proto-ipv4-fragmentation", "fragmentation-buffer-size-8192", "assembler-max-segment-count-16", "reassembly-buffer-size-8192", "reassembly-buffer-count-16"], optional = true }
snow = { version = "0.10.0", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
sysinfo = { version = "0.38.4", optional = true }
tempfile = { version = "3", optional = true }
thiserror = { version = "2", optional = true }
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros", "parsing"], optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-openssl = { version = "0.6.5", optional = true }
tokio-stream = { version = "0.1.18", features = ["net", "sync"], optional = true }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26.4", optional = true }
tokio-tungstenite = { version = "0.28", optional = true }
tonic = { version = "0.14.6", features = ["transport", "tls-ring", "tls-native-roots"], optional = true }
tonic-health = { version = "0.14.6", optional = true }
tonic-prost = { version = "0.14.6", optional = true }
tonic-reflection = { version = "0.14.6", optional = true }
tracing = { version = "0.1", optional = true }
tor-rtcompat = { version = "0.42.0", default-features = false, features = ["rustls", "tokio"], optional = true }
tun = { package = "tun-easytier", git = "https://github.com/EasyTier/rust-tun", features = ["async", "wintun-dns"], optional = true }
url = { version = "2.5", optional = true }
uuid = { version = "1", features = ["v4", "v5"], optional = true }
webpki-roots = { version = "1.0.9", optional = true }
webrtc-util = { version = "0.17.2", default-features = false, features = ["conn"], optional = true }
x25519-dalek = { version = "2.0.1", optional = true }
x509-parser = { version = "0.18.1", optional = true }
yamux = { version = "0.14.0", optional = true }
zeroize = { version = "1.8.2", features = ["derive"], optional = true }
zstd = { version = "0.13.3", default-features = false, optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
system-configuration = { version = "0.7.0", optional = true }

[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"], optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "tvos", target_os = "visionos", target_os = "watchos"))'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"], optional = true }

[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"], optional = true }
schannel = { version = "0.1.29", optional = true }
windows-sys = { version = "0.61.2", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinInet", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_IO", "Win32_System_Rpc", "Win32_System_SystemInformation", "Win32_System_Threading"], optional = true }

[target.'cfg(all(windows, any(target_arch = "x86_64", target_arch = "x86")))'.dependencies]
windivert = { git = "https://github.com/EasyTier/windivert-rust.git", rev = "adcc56d1550f7b5377ec2b3429f413ee24a77375", features = ["static"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-bindings = { version = "0.3.3", default-features = false, features = ["nftables"], optional = true }
netlink-socket2 = { version = "0.3.3", default-features = false, optional = true }
nfq = { version = "0.2.5", optional = true }
nix = { version = "0.28", features = ["socket"], optional = true }
rtnetlink = { version = "0.23", optional = true }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[build-dependencies]
capnpc = { version = "0.27.0", optional = true }
capnpc-embedded = { version = "0.2.0", optional = true }
cc = { version = "1", optional = true }
protoc-bin-vendored = { version = "3", optional = true }
tonic-prost-build = { version = "0.14.6", optional = true }
