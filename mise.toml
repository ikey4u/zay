# Task runner migrated from Makefile.
# Usage: mise run <task>   (or: mise <task>)
# Local overrides: mise.local.toml (gitignored)

[env]
CARGO_HOME_DIR = "/tmp/cargo-tmp"
MINGW_DLLTOOL = "{{env.MINGW_DLLTOOL | default(value='x86_64-w64-mingw32-dlltool')}}"
MINGW_CC = "{{env.MINGW_CC | default(value='x86_64-w64-mingw32-gcc')}}"
MINGW_AR = "{{env.MINGW_AR | default(value='x86_64-w64-mingw32-ar')}}"
TARGET_MACOS_ARM64 = "aarch64-apple-darwin"
# zig/cargo-zigbuild glibc 2.17 ABI (CentOS 7+, old distros)
ZIG_LINUX_TARGET = "x86_64-unknown-linux-gnu.2.17"
# Artifact directory (no glibc suffix in path)
TARGET_LINUX_X64 = "x86_64-unknown-linux-gnu"
TARGET_WINDOWS_X64 = "x86_64-pc-windows-gnu"
DIST_DIR = "dist"

[tasks."check:zig"]
description = "Require zig and cargo-zigbuild on PATH"
run = """
#!/usr/bin/env bash
set -euo pipefail
command -v zig >/dev/null || { echo "Install zig: https://ziglang.org/" >&2; exit 1; }
command -v cargo-zigbuild >/dev/null || {
  echo "Install cargo-zigbuild: cargo install cargo-zigbuild" >&2
  exit 1
}
"""

[tasks."check:mingw"]
description = "Require mingw-w64 tools for Windows GNU target"
run = """
#!/usr/bin/env bash
set -euo pipefail
missing() {
  echo "Missing $1, required for the Windows GNU target." >&2
  echo "Install it with: brew install mingw-w64" >&2
  echo "Or override $2=/path/to/tool." >&2
  exit 1
}
command -v "$MINGW_DLLTOOL" >/dev/null || missing "$MINGW_DLLTOOL" MINGW_DLLTOOL
command -v "$MINGW_CC" >/dev/null || missing "$MINGW_CC" MINGW_CC
command -v "$MINGW_AR" >/dev/null || missing "$MINGW_AR" MINGW_AR
"""

[tasks.setup]
description = "Create cargo home, add rustup targets, fetch crates"
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="${MISE_PROJECT_ROOT:-$PWD}"
mkdir -p "$CARGO_HOME_DIR"
rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu aarch64-apple-darwin
REMAP="--remap-path-prefix=${CARGO_HOME_DIR}=~ --remap-path-prefix=${ROOT}="
export CARGO_HOME="$CARGO_HOME_DIR"
export RUSTFLAGS="$REMAP"
if cargo fetch -q; then
  :
else
  echo "repairing broken registry in $CARGO_HOME_DIR" >&2
  rm -rf "$CARGO_HOME_DIR/registry"
  cargo fetch -q
fi
"""

[tasks."setup:zig"]
description = "setup + check:zig"
depends = ["setup", "check:zig"]
run = "true"

[tasks.format]
description = "Format Rust (nightly)"
run = """
#!/usr/bin/env bash
set -euo pipefail
cargo +nightly fmt
"""

[tasks.build]
description = "Release build for host"
depends = ["setup"]
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="${MISE_PROJECT_ROOT:-$PWD}"
REMAP="--remap-path-prefix=${CARGO_HOME_DIR}=~ --remap-path-prefix=${ROOT}="
export CARGO_HOME="$CARGO_HOME_DIR"
export RUSTFLAGS="$REMAP"
cargo build --release
"""

[tasks."macos:build:linux-x64"]
description = "Cross-build Linux x64 via cargo-zigbuild (glibc 2.17)"
depends = ["setup:zig"]
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="${MISE_PROJECT_ROOT:-$PWD}"
REMAP="--remap-path-prefix=${CARGO_HOME_DIR}=~ --remap-path-prefix=${ROOT}="
export CARGO_HOME="$CARGO_HOME_DIR"
export RUSTFLAGS="$REMAP"
cargo zigbuild --release --target "$ZIG_LINUX_TARGET"
BIN="target/${TARGET_LINUX_X64}/release/zay"
test -f "$BIN" || {
  echo "missing $BIN (zig target $ZIG_LINUX_TARGET)" >&2
  exit 1
}
"""

[tasks."macos:build:windows-x64"]
description = "Cross-build Windows x64 via cargo-zigbuild + mingw"
depends = ["setup:zig", "check:mingw"]
alias = ["macos:build:window-x64"]
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="${MISE_PROJECT_ROOT:-$PWD}"
REMAP="--remap-path-prefix=${CARGO_HOME_DIR}=~ --remap-path-prefix=${ROOT}= -C dlltool=${MINGW_DLLTOOL}"
export CARGO_HOME="$CARGO_HOME_DIR"
export "CC_x86_64_pc_windows_gnu=$MINGW_CC"
export "AR_x86_64_pc_windows_gnu=$MINGW_AR"
export RUSTFLAGS="$REMAP"
cargo zigbuild --release --target "$TARGET_WINDOWS_X64"
BIN="target/${TARGET_WINDOWS_X64}/release/zay.exe"
test -f "$BIN"
"""

[tasks."macos:build:macos-arm64"]
description = "Release build for aarch64-apple-darwin"
depends = ["setup"]
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="${MISE_PROJECT_ROOT:-$PWD}"
REMAP="--remap-path-prefix=${CARGO_HOME_DIR}=~ --remap-path-prefix=${ROOT}="
export CARGO_HOME="$CARGO_HOME_DIR"
export RUSTFLAGS="$REMAP"
cargo build --release --target "$TARGET_MACOS_ARM64"
BIN="target/${TARGET_MACOS_ARM64}/release/zay"
test -f "$BIN"
"""

[tasks."macos:build:all"]
description = "macOS host: release macOS/Linux/Windows without embedding $HOME paths"
# Requires: zig, cargo-zigbuild, mingw-w64, ripgrep.
# See scripts/cross_build_on_macos.sh (CARGO_HOME + remap-path-prefix + strip + verify).
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="${MISE_PROJECT_ROOT:-$PWD}"
exec bash "${ROOT}/scripts/cross_build_on_macos.sh"
"""

[tasks.pkg]
description = "Alias of macos:build:all (cross-builds + zip under dist/)"
alias = ["cross-build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="${MISE_PROJECT_ROOT:-$PWD}"
exec bash "${ROOT}/scripts/cross_build_on_macos.sh"
"""
