[package]
name = "zay"
version = "0.1.0"
edition = "2024"
description = "A simple network proxy based on clash "
repository = "https://github.com/ikey4u/zay"
license = "MIT OR Apache-2.0"

[features]
default = ["standard", "aws-lc-rs"]
standard = [
    "shadowsocks", "ssh", "shadowquic",
    "wireguard", "tailscale",
    "clash-lib/zero_copy",
    "tproxy", "tun", "redir",
]
plus    = ["standard", "onion"]
android = ["shadowsocks", "aws-lc-rs", "wireguard", "clash-lib/zero_copy", "tproxy"]
bsd     = ["shadowsocks", "ring", "clash-lib/zero_copy"]

shadowsocks = ["clash-lib/shadowsocks"]
ssh         = ["clash-lib/ssh"]
tuic        = ["clash-lib/tuic"]
onion       = ["clash-lib/onion"]
shadowquic  = ["clash-lib/shadowquic"]
wireguard   = ["clash-lib/wireguard"]
tailscale   = ["clash-lib/tailscale"]
tproxy      = ["clash-lib/tproxy"]
redir       = ["clash-lib/redir"]
tun         = ["clash-lib/tun"]

aws-lc-rs = ["dep:aws-lc-rs", "clash-lib/aws-lc-rs"]
ring      = ["clash-lib/ring"]

[dependencies]
clash-lib = { git = "https://github.com/Watfaq/clash-rs.git", rev = "5a024ffcb74df64959b556acf76665be6746c96e", package = "clash-lib", default-features = false }

clap                 = { version = "4", features = ["derive"] }
anyhow               = "1"
reqwest              = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
dirs-next            = "2"
serde                = { version = "1", features = ["derive"] }
serde_yaml           = "0.9"
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "local-time"] }
time                 = { version = "0.3", features = ["macros"] }
aws-lc-rs            = { version = "1", optional = true, default-features = false }

[patch.crates-io]
rustls       = { git = "https://github.com/Watfaq/rustls.git",       rev = "e6e8e7e1a0d65f2f273eb7b5b6179896536ac174" }
tokio-rustls = { git = "https://github.com/Watfaq/tokio-rustls.git", rev = "b26e3e2b7a0161d505fd12d6e545b16463f1a45f" }
