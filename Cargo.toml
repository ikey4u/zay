[package]
name = "zay"
version = "0.6.0"
edition = "2024"
description = "A simple network tool"
repository = "https://github.com/ikey4u/zay"
license = "MIT OR Apache-2.0"
build = "build.rs"

[build-dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
dirs-next = "2"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
toml = "0.8"
dirs = "6"
futures-util = "0.3"
russh = "0.60"
ssh2-config = "0.7"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = "1"
once_cell = "1"
easytier = { git = "https://github.com/EasyTier/EasyTier", rev = "8428a89d2dabc94c97d370ec607c6ca142473626", package = "easytier", default-features = false, features = ["tun", "wireguard", "socks5", "websocket", "smoltcp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
