[package]
name = "zay-ios"
version = "0.1.0"
edition = "2024"
description = "Zay iOS core: EasyTier mesh + sing-box config helpers"
publish = false

[lib]
name = "zay_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
once_cell = "1.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
url = "2.5"
urlencoding = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }

# Vendor EasyTier — mobile-friendly FFI surface + core.
easytier = { path = "../../../../vendor/Easytier/easytier", default-features = false, features = [
    "tun",
    "wireguard",
    "socks5",
    "websocket",
    "smoltcp",
    "quic",
    "kcp",
    "icmp-proxy",
    "management",
    "management-rpc",
] }
easytier-core = { path = "../../../../vendor/Easytier/easytier-core", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
log = "0.4"

[build-dependencies]
anyhow = "1"
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
