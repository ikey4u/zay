[package]
name = "zay-server"
version = "0.10.0"
edition = "2024"
description = "Standalone network servers powered by zay's singbox engine"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "s5"
path = "bin/s5.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
singbox-core = { package = "singbox", path = "../../crates/singbox", default-features = false, features = ["socks"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
