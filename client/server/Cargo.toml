[package]
name = "zay-server"
version = "0.10.0"
edition = "2024"
description = "Standalone network servers powered by zay's singbox engine"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "s5"
path = "bin/s5.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
percent-encoding = "2"
qrcode = { version = "0.14.1", default-features = false }
serde_json = "1"
singbox-core = { package = "singbox", path = "../../crates/singbox", default-features = false, features = ["socks"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
serde_yaml = "0.9"
