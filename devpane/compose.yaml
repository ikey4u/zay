name: devpane

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.126.0/24
          gateway: 172.30.126.1

services:
  be:
    image: devpane-be
    build:
      context: ..
      dockerfile: devpane/be/Dockerfile
      network: ${DEVPANE_BUILD_NETWORK:-default}
    environment:
      DEVPANE_ROLE: dns
      DEVPANE_DOH: "1"
      DEVPANE_IPV4_ONLY: "1"
      DEVPANE_ADVERTISE_HOST: 172.30.126.10
    networks:
      lab:
        ipv4_address: 172.30.126.10
    healthcheck:
      test: ["CMD", "/usr/local/bin/devpane-be", "--healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 20

  sink:
    image: devpane-be
    environment:
      DEVPANE_ROLE: sink
    networks:
      lab:
        ipv4_address: 172.30.126.11

  relay:
    image: devpane-zay
    build:
      context: ..
      dockerfile: devpane/Dockerfile
      network: ${DEVPANE_BUILD_NETWORK:-default}
    entrypoint: ["/usr/local/bin/devpane-relay"]
    environment:
      DEVPANE_MESH_AUTH: devpane:devpane-mesh
      DEVPANE_MESH_IP: 10.126.126.1/24
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      lab:
        ipv4_address: 172.30.126.30

  mesh-peer:
    image: devpane-zay
    init: true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /var/lib/zay
        sed "s/@DEVPANE_HOST@/$${DEVPANE_HOST_ADDR}/g" /etc/zay/mesh-peer.toml > /var/lib/zay/zay.toml
        exec zay x service --data-dir /var/lib/zay --config /var/lib/zay/zay.toml start
    environment:
      DEVPANE_HOST_ADDR: ${DEVPANE_HOST_ADDR:?run mise devpane to set up the host proxy}
    volumes:
      - ./mesh-peer.toml:/etc/zay/mesh-peer.toml:ro
    dns: [172.30.126.10]
    depends_on:
      be:
        condition: service_healthy
      relay:
        condition: service_started
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    networks:
      lab:
        ipv4_address: 172.30.126.31

  mesh-echo:
    image: devpane-be
    network_mode: "service:mesh-peer"
    environment:
      DEVPANE_ROLE: sink
      DEVPANE_SINK_PORT: 8090
    depends_on:
      mesh-peer:
        condition: service_started

  zay:
    image: devpane-zay
    # Reap Chromium helper processes and disconnected shell jobs.
    init: true
    build:
      context: ..
      dockerfile: devpane/Dockerfile
      network: ${DEVPANE_BUILD_NETWORK:-default}
    depends_on:
      be:
        condition: service_healthy
      relay:
        condition: service_started
      sink:
        condition: service_started
    environment:
      ZAY_LAB: devpane
      DEVPANE_HOST_ADDR: ${DEVPANE_HOST_ADDR:?run mise devpane to set up the host proxy}
      ZAY_LAB_PROXY_URL: http://devpane.test/whoami
      ZAY_LAB_DIRECT_URL: http://172.30.126.10:8090/whoami
      ZAY_LAB_EXTERNAL_URL: https://www.gstatic.com/generate_204
      ZAY_LAB_MESH_URL: http://10.126.126.3:8090/whoami
    # Container applications must use Zay DNS to retain proxy-domain FakeIP mappings.
    dns:
      - 10.14.14.10
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - zay-data:/var/lib/zay
    ports:
      - "127.0.0.1:18787:8787"
    networks:
      lab:
        ipv4_address: 172.30.126.20

volumes:
  zay-data:
